# Zero-shot prompts v1. Frozen before any test or held-out run; a change means a new file (prompts_v2.yaml) and a re-run.
# Both prompts state the same facts about the scene, including the gate schedule (fixed_v1).
# Options are lettered in the order given under `order`; the model answers with one letter and the letter probabilities are read
# from the first generated token (no free-text parsing).
name: prompts_v1
order: [normal, stuck_item, gate_open, spray, blocked_lens]
sheet: |
  This image is a contact sheet of 8 frames from one 6-second clip of a conveyor-belt station seen from above. It has 2 rows of 4 frames. Time runs left to right, top row first. The time of each frame is printed in its top-left corner (0.00 s to 5.25 s, in steps of 0.75 s).

  A normal clip looks like this:
  - Small coloured items travel left to right along the belt in three lanes.
  - A magenta gate arm at the right hangs straight down when closed. By schedule it swings open (flat) twice, from 1.0 s to 2.0 s and from 4.0 s to 5.0 s. So it is open in the frames at 1.50 s and 4.50 s and closed in the other six frames.
  - A pipe runs along the top and nothing leaks from it.
  - The view is clear.

  Choose the one condition that best describes this clip:
  {options}

  Answer with only the letter.
single: |
  This image is one frame, taken at 5.25 s, from a 6-second clip of a conveyor-belt station seen from above. The time is printed in its top-left corner.

  A normal clip looks like this:
  - Small coloured items travel left to right along the belt in three lanes.
  - A magenta gate arm at the right hangs straight down when closed. By schedule it is open (flat) from 1.0 s to 2.0 s and from 4.0 s to 5.0 s. At 5.25 s a normal gate is closed, hanging straight down.
  - A pipe runs along the top and nothing leaks from it.
  - The view is clear.

  Choose the one condition that best describes this clip:
  {options}

  Answer with only the letter.
options:
  normal: "normal: nothing is wrong."
  stuck_item: "stuck item: one item has stopped on the belt while the others keep moving, so items bunch up behind it (in the sheet it stays at the same place in consecutive frames; in a single frame you can only see items bunched up behind a gap)."
  gate_open: "gate stuck open: the gate arm is open (swung to the side) when it should be closed."
  spray: "spray leak: a thin pale-blue jet sprays from a joint in the pipe at the top, with a wet blue patch and droplets where it lands on the belt."
  blocked_lens: "blocked lens: a large dark smudge with soft edges covers part of the view."
