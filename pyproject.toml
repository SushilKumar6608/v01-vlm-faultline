[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.0.1"
description = "V01 Faultline: synthetic machine-hall fault detection, evaluated honestly"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full regeneration checks, run with -m slow"]
addopts = "-m 'not slow'"
